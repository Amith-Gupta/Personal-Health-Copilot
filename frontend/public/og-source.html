<!doctype html><!-- Source for public/og.png: open at 1200x630 and screenshot. --><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Geist:wght@400;500&family=Noto+Sans+Devanagari:wght@500&family=Noto+Sans+Telugu:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#141414;color:#f5f5f2;font-family:Geist,sans-serif;overflow:hidden;position:relative}
.wrap{position:absolute;inset:0;display:grid;grid-template-columns:1fr 440px}
.left{padding:64px 0 64px 72px;display:flex;flex-direction:column;justify-content:space-between}
.mark{font-family:"Bricolage Grotesque";font-size:34px;font-weight:700;letter-spacing:-.03em}
.mark b{color:#e8553d}
h1{font-family:"Bricolage Grotesque";font-optical-sizing:auto;font-size:66px;line-height:.98;letter-spacing:-.035em;font-weight:600;max-width:620px}
.sub{display:flex;gap:10px;align-items:center;font-size:20px;color:#b6b8c0}
.pill{background:#c4f542;color:#141414;font-weight:600;padding:8px 16px;border-radius:999px;font-size:18px}
.lang{font-family:"Noto Sans Devanagari","Noto Sans Telugu",Geist,sans-serif}
.photo{position:relative;margin:36px 36px 36px 0;border-radius:28px;overflow:hidden;background:#f4f3f1;box-shadow:0 40px 80px -30px rgba(0,0,0,.8)}
.photo img{position:absolute;left:0;right:0;bottom:0;width:100%;height:72%;object-fit:cover;object-position:50% 100%;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 30%);mask-image:linear-gradient(to bottom,transparent,#000 30%)}
</style></head><body>
<div class="wrap">
  <div class="left">
    <div class="mark">copilot<b>.</b></div>
    <h1>Your family's prescriptions, lab reports and discharge papers, read and explained.</h1>
    <div class="sub"><span class="pill">Scan or upload</span><span class="lang">English · हिन्दी · తెలుగు</span><span>· ABDM-ready</span></div>
  </div>
  <div class="photo"><img src="/hero-stethoscope.jpg" alt=""></div>
</div>
</body></html>
